<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售佣金与渠道返利管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .sidebar-item.active { background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%); color: white; }
        .sidebar-item:hover:not(.active) { background-color: #f1f5f9; }
        .card-hover { transition: all 0.2s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50">

<div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-900 via-primary-700 to-primary-500">
    <div class="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-chart-line text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">销售佣金与渠道返利</h1>
            <p class="text-slate-500 mt-2">自动化管理系统</p>
        </div>
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">用户名</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="login-username" value="admin" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">密码</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="login-password" value="admin123" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                </div>
            </div>
            <div id="login-error" class="hidden text-red-500 text-sm"></div>
            <button type="submit" class="w-full bg-gradient-to-r from-primary-600 to-primary-700 text-white py-3 rounded-xl font-medium hover:from-primary-700 hover:to-primary-800 transition-all shadow-lg shadow-primary-500/30">登 录</button>
        </form>
        <div class="mt-6 p-4 bg-slate-50 rounded-xl text-xs text-slate-500">
            <p class="font-medium mb-2">测试账号：</p>
            <p>管理员：admin / admin123</p>
            <p>销售经理：manager1 / password123</p>
            <p>财务：finance1 / password123</p>
            <p>销售：sales01 / sales01</p>
        </div>
    </div>
</div>

<div id="app-page" class="hidden min-h-screen flex">
    <aside class="w-64 bg-white shadow-lg flex flex-col">
        <div class="p-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center">
                    <i class="fas fa-chart-line text-white"></i>
                </div>
                <div>
                    <div class="font-bold text-slate-800">佣金返利系统</div>
                    <div class="text-xs text-slate-400">Commission System</div>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1" id="sidebar-nav">
            <a href="#" data-page="dashboard" class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-gauge-high w-5"></i><span>仪表盘</span></a>
            <a href="#" data-page="commission" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-coins w-5"></i><span>佣金明细</span></a>
            <a href="#" data-page="rebate" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-hand-holding-dollar w-5"></i><span>渠道返利</span></a>
            <a href="#" data-page="approval" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-clipboard-check w-5"></i><span>审批中心</span><span id="approval-badge" class="hidden ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
            <a href="#" data-page="appeal" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-comments w-5"></i><span>异议申诉</span></a>
            <a href="#" data-page="reports" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-file-chart-column w-5"></i><span>分析报告</span></a>
            <a href="#" data-page="calc" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600"><i class="fas fa-calculator w-5"></i><span>计算与同步</span></a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-100 rounded-full flex items-center justify-center"><i class="fas fa-user text-primary-600"></i></div>
                <div class="flex-1 min-w-0">
                    <div id="user-name" class="font-medium text-slate-800 truncate">用户</div>
                    <div id="user-role" class="text-xs text-slate-400 truncate">角色</div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-100 px-8 py-4 flex items-center justify-between">
            <div>
                <h2 id="page-title" class="text-xl font-bold text-slate-800">仪表盘</h2>
                <p id="page-subtitle" class="text-sm text-slate-400">系统概览</p>
            </div>
            <span id="current-date" class="text-sm text-slate-500"></span>
        </header>
        <div class="flex-1 p-8 overflow-auto">
            <div id="page-dashboard" class="page-content space-y-6"></div>
            <div id="page-commission" class="page-content hidden space-y-6"></div>
            <div id="page-rebate" class="page-content hidden space-y-6"></div>
            <div id="page-approval" class="page-content hidden space-y-6"></div>
            <div id="page-appeal" class="page-content hidden space-y-6"></div>
            <div id="page-reports" class="page-content hidden space-y-6"></div>
            <div id="page-calc" class="page-content hidden space-y-6"></div>
        </div>
    </main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800">标题</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="modal-body" class="p-6 overflow-auto max-h-[65vh]"></div>
    </div>
</div>

<div id="toast-container" class="fixed top-6 right-6 z-50 space-y-3"></div>

<script src="/static/app.js"></script>
</body>
</html>
